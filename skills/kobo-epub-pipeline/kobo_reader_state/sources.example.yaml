# ---------------------------------------------------------------------------
# Social signals — discovery layer only, NOT used as article content
# These boost the priority score of topics that are trending in the community.
# ---------------------------------------------------------------------------
social_signals:
  hacker_news:
    enabled: true
    min_points: 100   # ignore low-engagement stories
    days_back: 120

  reddit:
    enabled: true
    subreddits:
      - MachineLearning
      - LocalLLaMA
      - singularity
    min_score: 50
    days_back: 120

# ---------------------------------------------------------------------------
# Topic clustering — select shared topics, not one-off source articles
# enabled: true -> cluster article candidates and generate from the best cluster
# min_distinct_sources: require independent coverage before generating
# fallback_days_back: widen once if the normal window finds no eligible clusters
# social signals boost scoring but are not used as source material
# ---------------------------------------------------------------------------
clustering:
  enabled: true
  days_back: 120
  fallback_days_back: 120
  min_distinct_sources: 3
  max_candidates: 60
  max_candidates_per_source: 8
  max_clusters: 12
  novelty_window_days: 120
  source_pair_cooldown_days: 120
  fallback_if_llm_fails: true
  scoring:
    breadth_weight: 0.35
    authority_weight: 0.20
    recency_weight: 0.20
    social_weight: 0.15
    novelty_weight: 0.10

# ---------------------------------------------------------------------------
# Scoring weights — must sum to 1.0
# authority:  source prestige (arXiv, lab blog > newsletter)
# social:     HN/Reddit engagement signal
# recency:    exponential decay from publication date
# diversity:  penalty if same source appeared in recent articles
# ---------------------------------------------------------------------------
scoring:
  authority_weight: 0.30
  social_weight:    0.10
  recency_weight:   0.20
  diversity_weight: 0.40
  recency_half_life_days: 45  # score halves every N days

# ---------------------------------------------------------------------------
# Selection strategy
# prefer_layers: true -> choose practitioner layers first, then fallback
# allow_fallback_layers: true -> if no preferred candidate passes gate, use fallback
# ---------------------------------------------------------------------------
selection:
  mode: "single_source_deep_read"
  best_available: true
  freshness_days: 120
  similarity_window_days: 120
  source_cooldown_days: 21
  max_candidates_per_source: 3
  min_single_source_score: 0.0
  fallback_to_clusters: true
  prefer_layers: true
  allow_fallback_layers: true
  preferred_layers:
    - practitioner_core
    - practitioner_secondary
  fallback_layers:
    - research_primary
    - radar
    - unknown

# ---------------------------------------------------------------------------
# Generation settings
# ---------------------------------------------------------------------------
generation:
  provider: "codex"            # claude | codex
  claude_model: "claude-opus-4-6"
  codex_model: "gpt-5.3-codex"
  target_read_minutes: 20      # used to compute target_words when unset
  words_per_minute: 190        # reading speed assumption for estimate/caps
  target_words: 3600           # default tuned for ~20 min session
  hard_max_words: 4200         # prompt-enforced upper bound
  max_source_chars: 40000      # text fed to the generator (stay well under arg limits)

# ---------------------------------------------------------------------------
# Batch run settings
# ---------------------------------------------------------------------------
batch:
  max_count_per_run: 10       # safety rail for --count

# ---------------------------------------------------------------------------
# Quality gate settings
# Hybrid mode:
# 1) hard deterministic filter for obvious legal/promo boilerplate
# 2) LLM gate on top-K candidates before final selection
# ---------------------------------------------------------------------------
quality:
  enabled: true
  mode: "hybrid"
  gate_scope: "selection_top_k"
  top_k: 5
  reject_cache_days: 7
  fail_mode: "closed" # closed => reject candidate if LLM gate errors
  hard_filter:
    exclude_title_patterns:
      - "(?i)\\bterms?( and| &)conditions\\b"
      - "(?i)\\bterms? of (service|use)\\b"
      - "(?i)\\bprivacy policy\\b"
      - "(?i)\\bofficial rules?\\b"
      - "(?i)\\bcontest\\b"
      - "(?i)\\bsweepstakes\\b"
      - "(?i)\\beligibility\\b"
      - "(?i)\\blegal notice\\b"
    exclude_url_patterns:
      - "(?i)/legal/"
      - "(?i)/terms"
      - "(?i)/privacy"
      - "(?i)/contest"
      - "(?i)/sweepstakes"
      - "(?i)/official-rules"
    allow_title_patterns:
      - "(?i)\\b(technical report|research|benchmark|evaluation|method|architecture|paper|arxiv)\\b"
      - "(?i)\\b(how to|guide|deep dive|case study)\\b"

# ---------------------------------------------------------------------------
# Build settings
# ---------------------------------------------------------------------------
build:
  prefer_kepub: false         # true => attempt kepubify conversion after pandoc
  keep_epub_when_kepub: false # retain both files when conversion succeeds
  epub_base_font_percent: 50  # smaller default text for Kobo (half of previous baseline)
  epub_line_height: 1.35      # readable but compact on e-ink
  publisher: "Ben Pearson"    # EPUB publisher/author metadata for Kobo library display
  cover_enabled: true         # generate a simple per-article EPUB cover at build time

# ---------------------------------------------------------------------------
# Delivery backend
#
# Recommended for Kobo cloud pull: gws_drive mode.
# The script uploads EPUBs to a Drive folder, and Kobo pulls when it syncs.
#
# mode:
#   pull      -> stage file in inbox_dir
#   gws_drive -> upload directly to Google Drive via gws CLI machine profile
#   none      -> build only, no delivery
# ---------------------------------------------------------------------------
delivery:
  mode: "gws_drive"
  pull:
    inbox_dir: "~/kobo_pull_inbox"   # sync this folder to Drive/Dropbox
    link_latest: false               # avoid alias churn; keep one immutable file per article
    post_stage_command: ""           # optional command; placeholders: {file} {name} {dir}
  gws_drive:
    folder_id: "REPLACE_WITH_YOUR_DRIVE_FOLDER_ID"    # Rakuten Kobo folder
    config_dir: ""                                    # optional gws config dir override
    upload_latest_alias: false
    latest_alias_name: "Latest.kepub.epub"
    retention:
      enabled: true
      max_age_days: 14
      name_prefix: "20"
      name_suffix: ".epub"
      page_size: 200
      dry_run: false

# Kobo Daily Reader — Source Configuration
# Edit this file to add/remove sources and tune scoring.
# Script reads this on every run; no restart needed.

# ---------------------------------------------------------------------------
# arXiv — targeted AI engineering papers
# ---------------------------------------------------------------------------
arxiv:
  categories: []
  queries:
    - label: "agent evaluation"
      query: 'all:"agent evaluation" OR all:"agent eval" OR all:"AI agents evaluation"'
    - label: "context engineering"
      query: 'all:"context engineering" OR all:"agent memory" OR all:"tool use"'
    - label: "coding agents"
      query: 'all:"coding agents" OR all:"software engineering agents" OR all:"code agents"'
    - label: "mobile AI engineering"
      query: 'all:"mobile" AND all:"agent" AND all:"software engineering"'
  authority: 0.76
  focus: "Agent, eval, context, and software-engineering papers with practical product/platform relevance"
  rationale: "Useful when papers contain reusable methods, empirical results, or architecture lessons."
  max_results_per_category: 4
  max_total_results: 20
  days_back: 120

# ---------------------------------------------------------------------------
# Manual override source URLs — high-signal practical reads.
# Keep this small. Ongoing discovery should come from rss_feeds/html_indexes.
# ---------------------------------------------------------------------------
curated_sources: []

# ---------------------------------------------------------------------------
# HTML indexes — durable source pages without a clean public RSS feed.
# The crawler collects matching links from these pages each run.
# ---------------------------------------------------------------------------
html_indexes:
  - name: "Anthropic Engineering"
    url: "https://www.anthropic.com/engineering"
    authority: 0.96
    layer: "practitioner_core"
    role: "driver"
    source_type: "engineering_blog"
    max_links: 10
    url_contains:
      - "/engineering/"
    include_keywords:
      - agent
      - eval
      - context
      - harness
      - Claude Code
      - computer use
      - tool
      - memory
    exclude_keywords:
      - featured
    topic_tags: ["agents", "evals", "context engineering", "harness engineering"]
    default_summary: "Anthropic engineering post related to agents, evals, context, or applied AI systems."
    focus: "AI lab engineering posts about agents, evals, context, and production harnesses"
    rationale: "Primary engineering source with concrete implementation and evaluation lessons."


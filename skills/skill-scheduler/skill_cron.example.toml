[settings]
# Use a durable state directory on the machine that runs cron.
state_dir = "/home/ben/.local/state/skill-cron"
max_jobs_per_tick = 3
default_skill_executor = "opencode"

[skill_executors.opencode]
argv = ["/usr/local/bin/opencode", "run", "--attach", "http://127.0.0.1:4096", "--dir", "/path/to/workspace", "--model", "openai/gpt-5.6-luna", "--variant", "default"]
timeout_seconds = 3600

[[notifications]]
id = "phone"
provider = "ntfy"
enabled = false
events = ["failed", "timeout"]
url = "http://127.0.0.1:2586"
topic = "skill-scheduler"
priority = "high"
tags = ["warning"]

[commands.kobo_daily_reader]
argv = ["/home/ben/venvs/kobo/bin/python", "/home/ben/.claude/skills/kobo-epub-pipeline/kobo_daily_reader.py", "--count", "1"]
timeout_seconds = 2700
log_path = "/home/ben/logs/kobo_daily_reader.log"

[commands.youtube_podcast_generator]
argv = ["/usr/bin/python3", "/home/ben/.claude/skills/youtube-podcast-generator/youtube_research_podcast.py", "--feed", "/home/ben/.claude/skills/youtube-podcast-generator/youtube_feed.md"]
timeout_seconds = 3600

[commands.maintenance_check]
# Placeholder for a future deterministic maintenance check handler.
argv = ["/usr/bin/python3", "/home/ben/bin/maintenance_check.py"]
timeout_seconds = 300

[[jobs]]
id = "kobo-epub"
title = "Kobo Deep Dive EPUB"
enabled = true
command_id = "kobo_daily_reader"
schedule = { weekly = "mon,thu 05:00" }

[[jobs]]
id = "youtube-podcasts"
title = "YouTube NotebookLM Podcasts"
enabled = true
command_id = "youtube_podcast_generator"
schedule = { daily_at = "06:30" }

[[jobs]]
id = "maintenance-check"
title = "Maintenance Check"
enabled = false
command_id = "maintenance_check"
schedule = { every = "15m" }

[[jobs]]
id = "weekly-review"
title = "Weekly Review"
enabled = false
skill = "weekly-review"
instructions = "Follow the workspace instructions and write only approved outputs."
timeout_seconds = 1800
log_path = "/home/ben/logs/weekly_review.log"
schedule = { weekly = "sun 18:00" }
